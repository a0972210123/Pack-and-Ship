<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
  body{width:1280px;height:720px;overflow:hidden;color:#f4f4f7;position:relative;
    background:radial-gradient(120% 120% at 12% 0%,var(--a2,#241d47) 0%,#14141b 45%,#0b0b10 100%)}
  .glow{position:absolute;width:520px;height:520px;right:-120px;top:-80px;background:radial-gradient(circle,var(--glow,rgba(167,139,250,.18)),transparent 62%)}
  .wrap{padding:70px 74px;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:900px}
  .kick{display:inline-flex;align-items:center;gap:11px;font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold,#fbbf24);margin-bottom:22px}
  .kick .d{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold,#fbbf24),var(--goldd,#d97706));display:grid;place-items:center;color:#3a1d03;font-size:1.1rem}
  h1{font-size:60px;line-height:1.03;font-weight:850;letter-spacing:-.02em;margin-bottom:26px}
  h1 .g{background:linear-gradient(135deg,var(--gold,#fbbf24),var(--goldd,#d97706));-webkit-background-clip:text;background-clip:text;color:transparent}
  .feat{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
  .feat li{list-style:none;display:flex;align-items:center;gap:14px;font-size:19px;font-weight:600;color:#eceaf3}
  .feat .ck{width:28px;height:28px;border-radius:50%;background:rgba(52,211,153,.16);color:#34d399;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .lic{font-size:16px;color:#8b89a0}.lic b{color:var(--gold,#fbbf24)}
</style></head><body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="kick"><span class="d" id="emoji">◑</span> <span id="brand"></span></div>
    <h1 id="h1"></h1>
    <ul class="feat" id="feat"></ul>
    <div class="lic" id="lic"></div>
  </div>
<script>
  const c = window.__CFG || {};
  const r = document.documentElement.style;
  if (c.gold) r.setProperty('--gold', c.gold);
  if (c.goldDark) r.setProperty('--goldd', c.goldDark);
  document.getElementById('emoji').textContent = c.emoji || '◑';
  document.getElementById('brand').textContent = c.name || 'Skill';
  const hl = c.headline || 'Ship it in one command';
  const hi = c.highlight || hl.split(' ').slice(-2).join(' ');
  document.getElementById('h1').innerHTML = hl.replace(hi, `<span class="g">${hi}</span>`);
  document.getElementById('feat').innerHTML = (c.features || []).map(f => `<li><span class="ck">✓</span> ${f}</li>`).join('');
  document.getElementById('lic').innerHTML = c.footer || '';
</script>
</body></html>
