<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
  body{width:1280px;height:640px;overflow:hidden;color:#f4f4f7;position:relative;
    background:radial-gradient(115% 115% at 15% 5%,var(--a2,#2b2350) 0%,#15151c 48%,#0b0b10 100%)}
  .glow{position:absolute;width:560px;height:560px;right:-140px;top:-120px;background:radial-gradient(circle,var(--glow,rgba(167,139,250,.2)),transparent 62%)}
  .stage{display:flex;align-items:center;height:100%;padding:66px 74px;gap:40px}
  /* ── left text column (kept roomy; the layout from the text-only card) ── */
  .col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;max-width:820px}
  body.has-mock .col{flex:0 0 620px;max-width:620px}
  .kick{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--a,#a78bfa);margin-bottom:24px}
  .kick .d{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--a,#a78bfa),var(--ad,#7c3aed));display:grid;place-items:center;color:#fff;font-size:1.3rem}
  h1{font-size:60px;line-height:1.05;font-weight:850;letter-spacing:-.02em;margin-bottom:22px}
  body.has-mock h1{font-size:52px}
  h1 .g{background:linear-gradient(135deg,var(--a,#c4b5fd),var(--ad,#7c3aed));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:22px;line-height:1.45;color:#c8c6d4;margin-bottom:24px}
  body.has-mock .sub{font-size:20px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .pill{font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid #3a3358;color:#d7d3e6;background:rgba(124,58,237,.12)}
  .install{margin-top:22px;font-size:16px;color:#a9a7ba;font-family:ui-monospace,Menlo,monospace}
  .install b{color:var(--a,#c4b5fd)}
  /* ── right iconified example (a spotlit UI + a tour tooltip) ── */
  .mock{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:20px 4px 44px}
  .win{position:relative;width:100%;max-width:430px;background:linear-gradient(160deg,#1c1c28,#101017);border:1px solid #2d2d3c;border-radius:18px;box-shadow:0 34px 80px rgba(0,0,0,.55);padding:18px 18px 22px}
  .dots{display:flex;gap:7px;margin-bottom:18px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a3a48}
  .cards{display:flex;gap:13px}
  .cd{flex:1;background:#15151f;border:1px solid #24242f;border-radius:13px;padding:15px 16px}
  .cd .l{font-size:12px;font-weight:800;letter-spacing:.08em;color:#8a889c;text-transform:uppercase}
  .cd .v{font-size:27px;font-weight:850;margin-top:7px}
  /* the spotlit card: accent ring + light hairline halo (luminance-safe, mirrors the tour's a11y ring) */
  .cd.lit{border-color:transparent;background:#1b1b29;position:relative;z-index:2;
    box-shadow:0 0 0 3px var(--a,#a78bfa),0 0 0 6px rgba(255,255,255,.9),0 0 46px rgba(167,139,250,.55)}
  .tip{position:absolute;left:20px;bottom:-74px;width:262px;background:#fff;color:#15151c;border-radius:14px;padding:14px 16px;
    box-shadow:0 22px 50px rgba(0,0,0,.5);font-size:15px;line-height:1.4}
  .tip::before{content:'';position:absolute;top:-9px;left:40px;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:3px}
  .tip .h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .tip .ic{width:26px;height:26px;border-radius:8px;background:rgba(124,58,237,.14);display:grid;place-items:center;font-size:15px}
  .tip .ct{font-size:12px;font-weight:850;color:var(--ad,#7c3aed);background:rgba(124,58,237,.12);padding:3px 9px;border-radius:999px}
  .tip .tx{color:#3a3a48;font-weight:600}
</style></head><body>
  <div class="glow"></div>
  <div class="stage">
    <div class="col">
      <div class="kick"><span class="d" id="emoji">◑</span> <span id="brand">Skill</span></div>
      <h1 id="h1"></h1>
      <div class="sub" id="sub"></div>
      <div class="row" id="pills"></div>
      <div class="install" id="install"></div>
    </div>
    <div class="mock" id="mock" style="display:none">
      <div class="win">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="cards" id="cards"></div>
        <div class="tip" id="tip"></div>
      </div>
    </div>
  </div>
<script>
  const c = window.__CFG || {};
  const r = document.documentElement.style;
  if (c.accent) r.setProperty('--a', c.accent);
  if (c.accentDark) r.setProperty('--ad', c.accentDark);
  document.getElementById('emoji').textContent = c.emoji || '◑';
  document.getElementById('brand').textContent = c.name || 'Skill';
  const hl = c.tagline || 'Do more with one command';
  const words = hl.split(' ');
  const hi = c.highlight || words.slice(-2).join(' ');
  document.getElementById('h1').innerHTML = hi && hl.includes(hi) ? hl.replace(hi, `<span class="g">${hi}</span>`) : hl;
  document.getElementById('sub').textContent = c.sub || '';
  document.getElementById('pills').innerHTML = (c.pills || []).map(p => `<span class="pill">${p}</span>`).join('');
  document.getElementById('install').innerHTML = c.install ? `▸ <b>${c.install}</b>` : '';
  // iconified example (optional): a mini app window with one spotlit card + a tour tooltip
  const m = c.mock;
  if (m && (m.cards || []).length) {
    document.body.classList.add('has-mock');
    document.getElementById('mock').style.display = 'flex';
    const lit = Number.isInteger(m.spotlight) ? m.spotlight : 0;
    document.getElementById('cards').innerHTML = (m.cards || []).map((cd, i) =>
      `<div class="cd${i === lit ? ' lit' : ''}"><div class="l">${cd.label || ''}</div><div class="v">${cd.value || ''}</div></div>`).join('');
    const t = m.tip || {};
    document.getElementById('tip').innerHTML =
      `<div class="h"><span class="ic">${t.icon || '✨'}</span><span class="ct">${t.counter || '1/6'}</span></div>` +
      `<div class="tx">${t.text || ''}</div>`;
  }
</script>
</body></html>
