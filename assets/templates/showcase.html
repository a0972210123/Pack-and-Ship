<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo showcase</title>
<style>/*!
 * Toutour v0.1 (MIT) — spotlight tour styles.
 * Themeable via CSS custom properties; sensible light/dark defaults built in.
 * Override on :root to match your design system:
 *   --tt-surface --tt-text --tt-muted --tt-accent --tt-border --tt-radius --tt-mask
 */
:root {
  --tt-surface: #ffffff;
  --tt-text: #111827;
  --tt-muted: #6b7280;
  --tt-accent: #7c3aed;
  --tt-accent-bg: #ede9fe;
  --tt-border: #e5e7eb;
  --tt-radius: 12px;
  --tt-mask: rgba(0, 0, 0, .6);
}
@media (prefers-color-scheme: dark) {
  :root {
    --tt-surface: #16161a;
    --tt-text: #f9fafb;
    --tt-muted: #9ca3af;
    --tt-accent: #a78bfa;
    --tt-accent-bg: #2b2350;
    --tt-border: #2a2a33;
  }
}

#ttBlock, #ttSpot, #ttTip { display: none; }
#ttBlock.show { display: block; position: fixed; inset: 0; background: transparent; }
#ttSpot.show {
  display: block; position: fixed; pointer-events: auto;
  box-shadow: 0 0 0 200vmax var(--tt-mask);
  border: 2px solid var(--tt-accent); border-radius: 10px;
  /* CVD-safe: a white hairline between the accent ring and the dark mask makes
     the spotlight edge readable by luminance alone, whatever the viewer's
     color vision. Override --tt-halo to transparent to disable. */
  outline: 1px solid var(--tt-halo, rgba(255, 255, 255, .85));
  transition: top .35s ease, left .35s ease, width .35s ease, height .35s ease, border-radius .35s ease;
}
#ttSpot.tt-mask-off { box-shadow: none; }
#ttSpot.tt-ring-off { border-color: transparent; }
#ttSpot.no-anim { transition: none !important; }

#ttTip.show {
  display: block; position: fixed;
  background: var(--tt-surface); color: var(--tt-text);
  border: 1px solid var(--tt-border); border-radius: var(--tt-radius);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
  padding: .8rem .9rem .55rem; width: max-content;
  max-width: min(320px, calc(100vw - 24px));
  font: 400 14px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
}
#ttTip::before {
  content: ''; position: absolute; width: 12px; height: 12px;
  background: var(--tt-surface); transform: rotate(45deg); display: none;
}
#ttTip.tip-right::before  { display: block; left: -7px;  top: var(--tt-arrow-off, 20px); border-left: 1px solid var(--tt-border); border-bottom: 1px solid var(--tt-border); }
#ttTip.tip-left::before   { display: block; right: -7px; top: var(--tt-arrow-off, 20px); border-right: 1px solid var(--tt-border); border-top: 1px solid var(--tt-border); }
#ttTip.tip-bottom::before { display: block; top: -7px;   left: var(--tt-arrow-off, 20px); border-left: 1px solid var(--tt-border); border-top: 1px solid var(--tt-border); }
#ttTip.tip-top::before    { display: block; bottom: -7px;left: var(--tt-arrow-off, 20px); border-right: 1px solid var(--tt-border); border-bottom: 1px solid var(--tt-border); }

.tt-head  { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; }
.tt-ico   { font-size: 1.15rem; line-height: 1; }
.tt-count { font-size: .68rem; font-weight: 600; background: var(--tt-accent-bg); color: var(--tt-accent); border-radius: 999px; padding: .14rem .55rem; }
.tt-body  { font-size: .84rem; }
.tt-foot  { display: flex; gap: .5rem; margin-top: .7rem; }
.tt-btn {
  flex: 1; padding: .45rem .5rem; border: 1px solid var(--tt-border);
  background: transparent; color: var(--tt-text); border-radius: 8px;
  font-size: .78rem; font-weight: 500; cursor: pointer; line-height: 1.3;
}
.tt-btn:hover { border-color: var(--tt-accent); color: var(--tt-accent); }
.tt-btn-primary { background: var(--tt-accent); border-color: var(--tt-accent); color: #fff; font-weight: 600; }
.tt-btn-primary:hover { filter: brightness(1.1); color: #fff; }
.tt-skip {
  display: block; width: 100%; margin-top: .45rem; padding: .2rem;
  background: none; border: none; color: var(--tt-muted); font-size: .72rem;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.tt-skip:hover { color: var(--tt-text); }

@media (prefers-reduced-motion: reduce) {
  #ttSpot.show, #ttTip.show { transition: none !important; }
}
</style>
<style>
  :root{--bg:#f6f7fb;--surface:#fff;--text:#111827;--muted:#6b7280;--accent:#7c3aed;--accent-bg:#ede9fe;--border:#e8e9ef;--radius:14px;
        --tt-surface:var(--surface);--tt-text:var(--text);--tt-muted:var(--muted);--tt-accent:var(--accent);--tt-accent-bg:var(--accent-bg);--tt-border:var(--border);--tt-radius:14px}
  :root[data-theme=dark]{--bg:#0c0c11;--surface:#16161d;--text:#f4f4f7;--muted:#9ca3af;--accent:#a78bfa;--accent-bg:#241d47;--border:#26262f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.3rem}
  .brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;margin:.2rem .4rem 1.2rem}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:grid;place-items:center;color:#fff;font-size:.9rem}
  .nav{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:500}
  .nav.active{background:var(--accent-bg);color:var(--accent);font-weight:700}
  .main{padding:1.4rem 1.8rem}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem}
  .top h1{font-size:1.35rem;font-weight:800}
  .tools{display:flex;align-items:center;gap:.6rem}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.5rem .9rem;border-radius:10px;font-weight:600;cursor:pointer;font-size:.85rem}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .iconbtn{width:38px;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:10px;cursor:pointer;font-size:1rem}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.3rem}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem}
  .kpi .label{color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:1.7rem;font-weight:800;margin-top:.3rem}
  .kpi .delta{font-size:.8rem;font-weight:700;margin-top:.15rem}.up{color:#16a34a}.down{color:#dc2626}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;margin-bottom:1.2rem}
  .panel h3{font-size:.95rem;font-weight:800;margin-bottom:.2rem}.panel .sub{color:var(--muted);font-size:.82rem;margin-bottom:1rem}
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:.4rem}
  .bar{flex:1;background:linear-gradient(180deg,#a78bfa,#7c3aed);border-radius:7px 7px 0 0;opacity:.9}
  .filters{display:flex;gap:.5rem;margin-bottom:1rem;align-items:center}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:.35rem .8rem;border-radius:999px;font-size:.8rem;font-weight:600;cursor:pointer}
  .chip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
  @media(max-width:768px){
    .app{grid-template-columns:1fr}
    .side{flex-direction:row;align-items:center;gap:.4rem;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:.55rem .7rem}
    .brand{margin:0 .5rem 0 0;font-size:.95rem;flex-shrink:0}.nav{flex-shrink:0;white-space:nowrap;padding:.45rem .7rem}
    .main{padding:1rem .9rem}.top{margin-bottom:1rem}.top h1{font-size:1.15rem}.tools .btn{padding:.45rem .55rem;font-size:.76rem}
    .kpis{grid-template-columns:repeat(2,1fr);gap:.7rem;margin-bottom:1rem}.kpi .val{font-size:1.4rem}.bars{height:120px}.filters{flex-wrap:wrap}
  }
</style></head>

      '<div class="tt-foot"><button type="button" class="tt-btn" id="ttPrev"></button>' +
      '<button type="button" class="tt-btn tt-btn-primary" id="ttNext"></button></div>' +

    if (S.fresh) els.spot.classList.add('no-anim');      // no fly-in on first placement

  }

  // sit outside the lit area. Arrow aims at the target center.

      top:    rect.top - gap - m,

    if (st.place) order = [st.place].concat(order.filter(s => s !== st.place));

    if (side === 'right')  { x = rect.left + rect.w + gap; y = clamp(cy - th / 2, m, vh - th - m); }
    if (side === 'left')   { x = rect.left - gap - tw;     y = clamp(cy - th / 2, m, vh - th - m); }
    if (side === 'bottom') { y = rect.top + rect.h + gap;  x = clamp(cx - tw / 2, m, vw - tw - m); }
    if (side === 'top')    { y = rect.top - gap - th;      x = clamp(cx - tw / 2, m, vw - tw - m); }
    tip.classList.add('tip-' + side);

      ? clamp(cy - y - 6, 14, th - 26) : clamp(cx - x - 6, 14, tw - 26);
    tip.style.setProperty('--tt-arrow-off', off + 'px');
    tip.style.left = x + 'px'; tip.style.top = y + 'px';

    cancelAnimationFrame(S.raf); S.raf = 0; S.lastRect = null;

    els.tip.classList.remove('show');

</script>
<script>

  document.querySelectorAll('#filters .chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('#filters .chip').forEach(function(x){x.classList.remove('on');});c.classList.add('on');});});
  var steps=[
    {target:'#kpis',icon:'📊',place:'bottom',text:'Your headline metrics — at a glance.'},
    {target:'.side',icon:'🧭',place:'right',text:'Navigate your sections from the sidebar.'},
    {target:'#filters',icon:'🎛️',place:'top',text:'Filter and slice the chart.'},
    {target:'#dateRange',icon:'📅',place:'bottom',text:'Change the date range to compare periods.'},
    {target:'#exportBtn',icon:'⬇️',place:'bottom',text:'Export the current view in one click.'},
    {target:'#helpBtn',icon:'❓',place:'bottom',text:'Replay this tour anytime.'}
  ];
  var opts={storageKey:'demo_showcase',zIndex:9000};
  document.getElementById('helpBtn').addEventListener('click',function(){Toutour.start(steps,opts);});
  window.__startTour=function(){return Toutour.start(steps,opts);};   // hook for asset generators
</script>
