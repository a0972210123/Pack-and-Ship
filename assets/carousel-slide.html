<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
  body{width:1080px;height:1350px;overflow:hidden;color:#f4f4f7;position:relative;
    background:radial-gradient(120% 100% at 18% 0%,var(--a2,#2b2350) 0%,#15151c 46%,#0b0b10 100%)}
  .glow{position:absolute;width:640px;height:640px;right:-160px;top:-140px;border-radius:50%;
    background:radial-gradient(circle,var(--glow,rgba(167,139,250,.22)),transparent 62%)}
  .wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between}
  .kick{display:inline-flex;align-items:center;gap:16px;font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--a,#a78bfa)}
  .kick .d{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--a,#a78bfa),var(--ad,#7c3aed));display:grid;place-items:center;color:#fff;font-size:1.7rem}
  .idx{font-size:20px;font-weight:800;color:#6f6d84;letter-spacing:.05em}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center}
  /* cover */
  .cover h1{font-size:96px;line-height:1.02;font-weight:850;letter-spacing:-.02em}
  .cover h1 .g{background:linear-gradient(135deg,var(--a,#c4b5fd),var(--ad,#7c3aed));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cover .sub{margin-top:34px;font-size:34px;line-height:1.4;color:#c8c6d4;max-width:840px}
  /* feature */
  .num{width:132px;height:132px;border-radius:34px;background:rgba(124,58,237,.16);border:2px solid var(--a,#a78bfa);
    display:grid;place-items:center;font-size:62px;font-weight:850;color:var(--a,#c4b5fd);margin-bottom:44px}
  .feature h2{font-size:78px;line-height:1.04;font-weight:850;letter-spacing:-.02em}
  .feature p{margin-top:30px;font-size:37px;line-height:1.42;color:#c8c6d4;max-width:860px}
  /* cta */
  .cta h2{font-size:88px;line-height:1.03;font-weight:850;letter-spacing:-.02em}
  .cta h2 .g{background:linear-gradient(135deg,var(--a,#c4b5fd),var(--ad,#7c3aed));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cta .lic{margin-top:26px;font-size:34px;font-weight:700;color:var(--a,#c4b5fd)}
  .cmd{margin-top:52px;display:inline-flex;align-items:center;gap:18px;align-self:flex-start;background:#0f0f14;border:1px solid #2a2a33;
    color:#d7d3e6;font-family:ui-monospace,Menlo,monospace;font-size:32px;font-weight:700;padding:28px 38px;border-radius:20px}
  .cmd .pr{color:var(--a,#a78bfa)}
  .bot{display:flex;align-items:center;justify-content:space-between;font-size:24px;font-weight:700;color:#8b89a0}
  .swipe{display:inline-flex;align-items:center;gap:12px;color:var(--a,#c4b5fd)}
  .swipe .ar{font-size:30px}
  .dots{display:flex;gap:11px}.dot{width:14px;height:14px;border-radius:50%;background:#3a3358}.dot.on{background:var(--a,#a78bfa)}
</style></head><body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="top">
      <div class="kick"><span class="d" id="emoji">◑</span> <span id="brand">Skill</span></div>
      <div class="idx" id="idx"></div>
    </div>
    <div class="body" id="body"></div>
    <div class="bot">
      <div class="dots" id="dots"></div>
      <div id="foot"></div>
    </div>
  </div>
<script>
  const c = window.__CFG || {};
  const r = document.documentElement.style;
  if (c.accent) r.setProperty('--a', c.accent);
  if (c.accentDark) r.setProperty('--ad', c.accentDark);
  document.getElementById('emoji').textContent = c.emoji || '◑';
  document.getElementById('brand').textContent = c.name || 'Skill';
  const total = c.total || 1, i = c.index || 0;
  document.getElementById('idx').textContent = String(i + 1).padStart(2, '0') + ' / ' + String(total).padStart(2, '0');
  document.getElementById('dots').innerHTML = Array.from({ length: total }, (_, k) => `<span class="dot${k === i ? ' on' : ''}"></span>`).join('');
  const s = c.slide || {};
  const grad = (txt, hi) => hi && txt.includes(hi) ? txt.replace(hi, `<span class="g">${hi}</span>`) : txt;
  const body = document.getElementById('body');
  const foot = document.getElementById('foot');
  if (s.type === 'cover') {
    body.className = 'body cover';
    body.innerHTML = `<h1>${grad(s.title || '', s.highlight)}</h1>` + (s.sub ? `<div class="sub">${s.sub}</div>` : '');
    foot.innerHTML = `<span class="swipe">swipe <span class="ar">→</span></span>`;
  } else if (s.type === 'cta') {
    body.className = 'body cta';
    body.innerHTML = `<h2>${grad(s.title || '', s.highlight)}</h2>` +
      (s.lic ? `<div class="lic">${s.lic}</div>` : '') +
      (c.install ? `<div class="cmd"><span class="pr">▸</span> ${c.install}</div>` : '');
    foot.textContent = c.homepage || '';
  } else {
    body.className = 'body feature';
    body.innerHTML = (s.n ? `<div class="num">${s.n}</div>` : '') +
      `<h2>${s.title || ''}</h2>` + (s.text ? `<p>${s.text}</p>` : '');
    foot.textContent = c.name || '';
  }
</script>
</body></html>
